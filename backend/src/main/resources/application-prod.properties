# Point these at a real PostgreSQL instance in production. DATABASE_URL must be
# a JDBC URL (jdbc:postgresql://host:port/database) - most managed Postgres
# dashboards (Render, Railway, ...) show a postgres://user:pass@host:port/db
# connection string instead, which needs converting: put user/pass in
# DATABASE_USERNAME/DATABASE_PASSWORD below and only host/port/db in this URL.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

logging.level.com.tunetogether=INFO
