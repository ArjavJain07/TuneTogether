spring.application.name=tunetogether-backend
server.port=8081

# Virtual threads for the servlet request pool; the WebSocket/STOMP channel
# executors are additionally reconfigured explicitly (see WebSocketConfig).
spring.threads.virtual.enabled=true

# Comma-separated list of allowed browser origins for CORS *and* the STOMP/SockJS
# endpoint - both configs read this same property so they can never drift apart.
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://127.0.0.1:5500,https://ogarsh.tech

# JWT signing. Override via the JWT_SECRET env var in any real deployment -
# the default is dev-only and intentionally obvious about that.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-CHANGE_ME-1234567890}
app.jwt.access-token-ttl-minutes=60
app.jwt.refresh-token-ttl-days=30

# Google Sign-In (Google Identity Services). Leave empty to disable Google login
# without breaking startup - guest mode keeps working regardless.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# YouTube Data API v3. Leave empty to make /api/music/search fail over to the
# frontend's own demo-mode fallback (matches the original app's behavior).
app.youtube.api-key=${YOUTUBE_API_KEY:}

# Party room engine
app.room.code-length=6
app.room.idle-timeout-minutes=30
app.room.reap-interval-ms=60000
app.room.chat-history-limit=200

# Music search rate limiting (per authenticated principal)
app.music.rate-limit-per-minute=30

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
